# Every Hugging Face repo id in one place.
#
# Why this file exists: the stage-2 notebook was named "Qwen3_5_(4B)" while
# training a 0.8B, and its Weights & Biases config logged architecture
# "Qwen3.5-4B". Three names, one model. Anything that needs a model id reads
# it from here so there is exactly one place to be wrong.

base:
  # TODO: fill in the upstream Hugging Face ids for the untuned base models.
  # Needed for the 2B scaling work; the 0.8B path starts from stage1.merged
  # below and never touches the raw base.
  qwen_0_8b: null
  qwen_2b: null

stage1:
  # General EN-VI adaptation on PhoMT.
  # WARNING: the notebook that produced this artifact has not been located.
  # The weights exist; the recipe does not. See PLAN.md 14.5 and 16.2.
  merged: phuclhp1922/qwen3.5_0.8B_translation_merged_16bit

stage2:
  # Bible-commentary domain adaptation, trained on top of stage1.merged.
  adapter: phuclhp1922/bct_qwen3.5_0.8B_lora
  merged: phuclhp1922/bct_qwen3.5_0.8B_translation_merged_16bit
  gguf: phuclhp1922/bct_qwen3.5_0.8B_translation_gguf

wandb:
  project: bct-qwen-translation-vn
